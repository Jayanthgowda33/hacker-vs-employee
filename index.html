<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HACKER vs EMPLOYEE — One Decision Can Change Everything</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --void:#04050a; --navy:#070a12; --panel:#0b0f18;
  --emp-bg:#0c111c; --emp-bg2:#0f1626;
  --atk-bg:#050608; --atk-bg2:#020304;
  --blue:#4da3ff; --blue2:#7fd0ff;
  --safe:#34d399; --caution:#f5b544; --high:#ff8a5c; --danger:#ef4b53;
  --border:rgba(255,255,255,0.09); --mist:#a9b3c4;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--void); color:#fff; font-family:'Inter',sans-serif;
  overflow-x:hidden;
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
::selection{background:rgba(77,163,255,.35);}
::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:rgba(77,163,255,.3);border-radius:4px;}
button{font-family:inherit; cursor:pointer;}
:focus-visible{outline:2px solid var(--blue); outline-offset:3px; border-radius:4px;}

@keyframes fadeIn{from{opacity:0} to{opacity:1}}
@keyframes fadeUp{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:translateY(0)}}
@keyframes pulseSoft{0%,100%{opacity:.6} 50%{opacity:1}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(239,75,83,.5)} 70%{box-shadow:0 0 0 14px rgba(239,75,83,0)} 100%{box-shadow:0 0 0 0 rgba(239,75,83,0)}}
@keyframes glitch{
  0%,100%{ clip-path: inset(0 0 0 0); transform:translate(0,0); }
  20%{ clip-path: inset(10% 0 60% 0); transform:translate(-1px,0); }
  40%{ clip-path: inset(60% 0 5% 0); transform:translate(1px,0); }
  60%{ clip-path: inset(30% 0 40% 0); transform:translate(-1px,0); }
  80%{ clip-path: inset(5% 0 70% 0); transform:translate(1px,0); }
}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes countUpFlicker{0%{opacity:.3} 100%{opacity:1}}
.fade-in{animation:fadeIn .6s ease both;}
.fade-up{animation:fadeUp .55s cubic-bezier(.16,1,.3,1) both;}
.pulse{animation:pulseSoft 2.4s ease-in-out infinite;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

.wrap{max-width:1280px; margin:0 auto; padding:0 20px;}
.btn{border:none; border-radius:10px; padding:13px 22px; font-size:13px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; transition:all .2s ease;}
.btn-primary{background:linear-gradient(90deg,var(--blue),#7fa8ff); color:#03050a; box-shadow:0 0 26px rgba(77,163,255,.3);}
.btn-primary:hover{transform:translateY(-2px); box-shadow:0 0 38px rgba(77,163,255,.45);}
.btn-safe{background:rgba(52,211,153,.14); color:#5eead4; border:1px solid rgba(52,211,153,.4);}
.btn-safe:hover{background:rgba(52,211,153,.22); transform:translateY(-1px);}
.btn-risky{background:rgba(255,255,255,.05); color:#e7ecf5; border:1px solid var(--border);}
.btn-risky:hover{background:rgba(255,255,255,.09); transform:translateY(-1px);}
.btn-danger{background:rgba(239,75,83,.14); color:#ff9da2; border:1px solid rgba(239,75,83,.4);}
.btn-danger:hover{background:rgba(239,75,83,.22);}
.btn-ghost{background:transparent; color:var(--mist); border:1px solid var(--border);}
.btn-ghost:hover{color:#fff; border-color:rgba(255,255,255,.3);}
.btn-block{display:block; width:100%; text-align:left;}

.glass{background:rgba(255,255,255,.035); border:1px solid var(--border); backdrop-filter:blur(14px);}
.card{border-radius:14px; padding:18px;}

/* INTRO */
.intro-screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px; position:relative;}
.intro-line{font-size:clamp(16px,2.6vw,26px); color:#dfe6f2; margin:6px 0; opacity:0; animation:fadeUp .9s ease forwards;}
.intro-title{font-size:clamp(40px,9vw,96px); font-weight:700; line-height:1; margin:26px 0 10px; opacity:0; animation:fadeIn 1s ease forwards;}
.intro-title .vs{color:var(--danger); font-size:.5em; display:block; letter-spacing:.3em; margin:6px 0;}
.intro-sub{color:var(--mist); font-size:14px; letter-spacing:.08em; margin-bottom:36px; opacity:0; animation:fadeIn 1s ease forwards;}

/* SPLIT LAYOUT */
.sim-shell{min-height:100vh; display:flex; flex-direction:column;}
.topbar{position:sticky; top:0; z-index:40; background:rgba(4,5,10,.85); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); padding:12px 20px;}
.topbar-inner{display:flex; align-items:center; gap:16px; max-width:1280px; margin:0 auto; flex-wrap:wrap;}
.brand{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; flex-shrink:0;}
.brand .vs{color:var(--danger);}
.scenario-tag{font-size:11px; letter-spacing:.1em; color:var(--mist); text-transform:uppercase;}
.risk-meter{display:flex; align-items:center; gap:10px; margin-left:auto;}
.risk-track{width:140px; height:8px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden; position:relative;}
.risk-fill{height:100%; border-radius:4px; transition:width .6s cubic-bezier(.16,1,.3,1), background .6s ease;}
.risk-label{font-size:11px; font-weight:700; letter-spacing:.08em; padding:4px 10px; border-radius:999px; white-space:nowrap;}

.split{display:flex; flex:1; min-height:calc(100vh - 58px);}
.panel-employee{flex:0 0 60%; background:linear-gradient(160deg, var(--emp-bg), var(--emp-bg2)); border-right:1px solid var(--border); padding:28px 30px 60px; position:relative;}
.panel-attacker{flex:0 0 40%; background:radial-gradient(circle at 30% 0%, rgba(239,75,83,.05), var(--atk-bg2) 60%); padding:28px 24px 60px; position:relative;}
.panel-label{font-size:11px; letter-spacing:.16em; color:var(--mist); text-transform:uppercase; margin-bottom:16px; display:flex; align-items:center; gap:8px;}
.panel-label.emp{color:#8fc2ff;}
.panel-label.atk{color:#ff9da2;}
.app-chrome{display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:8px; background:rgba(255,255,255,.04); border:1px solid var(--border); font-size:11px; letter-spacing:.08em; color:var(--mist); margin-bottom:22px;}

/* mobile tabs */
.mobile-tabs{display:none; position:sticky; top:58px; z-index:35; background:rgba(4,5,10,.92); border-bottom:1px solid var(--border);}
.mobile-tabs-inner{display:flex;}
.mobile-tab{flex:1; padding:12px; text-align:center; font-size:12px; letter-spacing:.08em; font-weight:700; color:var(--mist); background:transparent; border:none; border-bottom:2px solid transparent;}
.mobile-tab.active{color:#fff; border-bottom-color:var(--blue);}
@media (max-width:880px){
  .split{flex-direction:column;}
  .panel-employee, .panel-attacker{flex:1 1 auto; width:100%; border-right:none;}
  .panel-employee{display:none;} .panel-attacker{display:none;}
  .panel-employee.mobile-active{display:block;} .panel-attacker.mobile-active{display:block;}
  .mobile-tabs{display:block;}
}

/* EMAIL / MESSAGE CARDS */
.email-card{background:rgba(255,255,255,.045); border:1px solid var(--border); border-radius:14px; padding:22px; max-width:520px; transition:transform .25s ease, box-shadow .25s ease;}
.email-meta{font-size:12.5px; color:var(--mist); margin-bottom:3px;}
.email-subject{font-size:17px; font-weight:700; margin:8px 0 10px;}
.email-body{font-size:13.5px; color:#d5dceb; line-height:1.6; margin-bottom:20px;}
.sender-highlight{font-family:'JetBrains Mono',monospace; font-size:13px; padding:8px 12px; border-radius:8px; background:rgba(239,75,83,.12); border:1px solid rgba(239,75,83,.4); color:#ffb3b7; display:inline-block; margin:10px 0;}
.warn-banner{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--caution); background:rgba(245,181,68,.1); border:1px solid rgba(245,181,68,.35); padding:9px 12px; border-radius:8px; margin:12px 0;}

.choice-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px;}

/* PHONE / MFA */
.phone-shell{width:230px; margin:0 auto; background:#0a0e17; border:1px solid var(--border); border-radius:26px; padding:18px 16px; box-shadow:0 20px 50px rgba(0,0,0,.5);}
.phone-notif{background:rgba(255,255,255,.06); border-radius:12px; padding:14px; text-align:center;}
.phone-notif .ico{width:38px; height:38px; border-radius:50%; background:rgba(77,163,255,.18); border:1px solid rgba(77,163,255,.4); display:flex; align-items:center; justify-content:center; margin:0 auto 8px; font-size:16px;}

/* FEEDBACK */
.feedback-box{margin-top:18px; padding:14px 16px; border-radius:10px; font-size:13.5px; font-weight:600; max-width:520px;}
.feedback-safe{background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.35); color:#8ff2d1;}
.feedback-risky{background:rgba(239,75,83,.1); border:1px solid rgba(239,75,83,.35); color:#ffb3b7;}
.feedback-neutral{background:rgba(255,255,255,.05); border:1px solid var(--border); color:#dfe6f2;}

/* ATTACKER GRAPH */
.atk-chain{position:relative; padding-left:6px;}
.atk-node{position:relative; display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:10px; margin-bottom:4px; border:1px solid var(--border); background:rgba(255,255,255,.02); transition:all .4s ease;}
.atk-node.reached{border-color:rgba(239,75,83,.5); background:rgba(239,75,83,.08); box-shadow:0 0 22px rgba(239,75,83,.15);}
.atk-node.justreached{animation:pulseRing 1.2s ease-out 1;}
.atk-dot{width:12px; height:12px; border-radius:50%; background:#2a3140; flex-shrink:0; transition:all .4s ease;}
.atk-node.reached .atk-dot{background:var(--danger); box-shadow:0 0 10px rgba(239,75,83,.7);}
.atk-connector{width:2px; height:18px; background:rgba(255,255,255,.08); margin-left:19px; transition:background .5s ease;}
.atk-connector.reached{background:linear-gradient(var(--danger), rgba(239,75,83,.2));}
.atk-nodelabel{font-size:12.5px; font-weight:700; letter-spacing:.04em; color:#c7cfdd;}
.atk-node.reached .atk-nodelabel{color:#ffcfd2;}
.atk-status{margin-left:auto; font-size:10.5px; color:#6b7280;}
.atk-node.reached .atk-status{color:#ff9da2;}

.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:70; padding:12px 22px; border-radius:999px; font-size:12.5px; font-weight:700; letter-spacing:.05em; box-shadow:0 10px 30px rgba(0,0,0,.5); animation:fadeUp .4s ease both;}
.toast-safe{background:#0e2a22; color:#7ff4cf; border:1px solid rgba(52,211,153,.5);}
.toast-risky{background:#2a1214; color:#ff9da2; border:1px solid rgba(239,75,83,.5);}

/* DELAYED / ENDING */
.center-screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:60px 20px;}
.ending-title{font-size:clamp(30px,6vw,54px); font-weight:700; margin:10px 0;}
.ending-tag{font-size:13px; letter-spacing:.12em; padding:6px 16px; border-radius:999px; display:inline-block; margin-bottom:18px;}

.score-ring-wrap{position:relative; width:200px; height:200px; margin:20px auto;}

.breakdown-row{display:flex; align-items:center; gap:14px; max-width:420px; margin:0 auto 12px;}
.breakdown-label{width:170px; font-size:12.5px; color:var(--mist); text-align:left; flex-shrink:0;}
.breakdown-track{flex:1; height:7px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden;}
.breakdown-fill{height:100%; border-radius:4px; background:linear-gradient(90deg,var(--blue),var(--blue2)); transition:width 1.1s cubic-bezier(.16,1,.3,1);}
.breakdown-val{width:38px; font-size:12px; color:#cdd6e6; text-align:right;}

.rewind-node{font-size:14px; font-weight:700; letter-spacing:.05em; color:#6b7280; margin:10px 0; transition:all .5s ease;}
.rewind-node.active{color:#ff9da2; transform:scale(1.1);}
.turning-card{max-width:520px; margin:26px auto 0; text-align:left;}

select, input[type=checkbox]{accent-color:var(--blue);}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react,typescript">
const { useState, useEffect, useRef, useReducer, useMemo } = React;

/* =========================================================
   SCENARIO DATA
========================================================= */
const SCENARIOS = [
  { id:'phishing', title:'PHISHING EMAIL', app:'INBOX', time:'9:17 AM' },
  { id:'mfa', title:'MFA FATIGUE', app:'AUTHENTICATOR', time:'9:42 AM' },
  { id:'impersonation', title:'MANAGER IMPERSONATION', app:'TEAMS', time:'11:05 AM' },
  { id:'file', title:'SUSPICIOUS FILE', app:'FILES', time:'1:30 PM' },
  { id:'wifi', title:'PUBLIC WI-FI', app:'WI-FI', time:'5:50 PM' },
];

const TURNING_EXPLAIN = {
  phishing: 'Checking the sender or reporting the suspicious message could have stopped the attack before credentials were exposed.',
  mfa: 'Denying the sign-in request or reporting it would have kept the attacker locked out of the account.',
  impersonation: 'Calling the manager directly would have revealed the message was fake before anything was shared.',
  file: 'Scanning or reporting the file would have caught the threat before it reached the device.',
  wifi: 'Verifying the network with staff or avoiding sensitive activity would have prevented exposure on an untrusted connection.',
};

const ATTACKER_NODES = ['TARGET', 'CREDENTIALS', 'ACCOUNT', 'EMAIL / FILES', 'COMPANY ACCESS'];

/* =========================================================
   ENGINE
========================================================= */
function clamp(n, lo, hi){ return Math.max(lo, Math.min(hi, n)); }

function riskLevel(score){
  if(score >= 75) return 'CRITICAL';
  if(score >= 50) return 'HIGH';
  if(score >= 25) return 'CAUTION';
  return 'SAFE';
}
const RISK_COLOR = { SAFE:'#34d399', CAUTION:'#f5b544', HIGH:'#ff8a5c', CRITICAL:'#ef4b53' };

function reachedNodes(flags){
  return {
    TARGET: true,
    CREDENTIALS: flags.credentialsCompromised,
    ACCOUNT: flags.accountCompromised,
    'EMAIL / FILES': flags.sensitiveAccessGranted,
    'COMPANY ACCESS': flags.companyAccessReached,
  };
}

function computeEnding(flags, counts){
  if(flags.companyAccessReached) return 'BREACH';
  if(flags.accountCompromised) return 'ACCOUNT_COMPROMISED';
  if(counts.riskyDecisions > 0) return 'CLOSE_CALL';
  return 'HERO';
}

const ENDING_META = {
  HERO: { title:'SECURITY HERO', status:'ATTACK BLOCKED', risk:'SAFE', color:'#34d399',
    desc:'Every attack attempt was identified and stopped before it could gain a foothold.' },
  CLOSE_CALL: { title:'CLOSE CALL', status:'INCIDENT CONTAINED', risk:'STABILIZED', color:'#f5b544',
    desc:'Some risky decisions occurred, but the security team contained the incident before real damage was done.' },
  ACCOUNT_COMPROMISED: { title:'ACCOUNT COMPROMISED', status:'ACCOUNT ACCESS LOST', risk:'HIGH', color:'#ff8a5c',
    desc:'The attacker obtained account access. Wider company damage was limited, but the account itself was compromised.' },
  BREACH: { title:'COMPANY BREACH', status:'SECURITY INCIDENT ESCALATED', risk:'CRITICAL', color:'#ef4b53',
    desc:'A chain of unsafe decisions allowed the attacker to escalate from account access to company-wide exposure.' },
};

function computeFinalScores(flags, awareness){
  const accountProtection = clamp(
    100 - (flags.accountCompromised ? 50 : 0) - (flags.riskyWifi ? 20 : 0) - (flags.credentialsCompromised ? 10 : 0),
    0, 100
  );
  const breakdown = {
    'Phishing Detection': awareness.phishing ?? 100,
    'MFA Awareness': awareness.mfa ?? 100,
    'Social Engineering': awareness.social ?? 100,
    'Suspicious Files': awareness.files ?? 100,
    'Account Protection': accountProtection,
  };
  const values = Object.values(breakdown);
  const overall = Math.round(values.reduce((a,b)=>a+b,0) / values.length);
  return { breakdown, overall };
}

/* =========================================================
   INITIAL STATE + REDUCER
========================================================= */
function initialState(){
  return {
    screen: 'intro', // intro | sim | ending | rewind
    scenarioIndex: 0,
    phase: 'deciding', // deciding | resolved | delayed
    riskScore: 5,
    flags: {
      credentialsCompromised:false, accountCompromised:false,
      sensitiveAccessGranted:false, companyAccessReached:false, riskyWifi:false, fileOpened:false,
    },
    counts: { safeDecisions:0, riskyDecisions:0, securityNotified:0 },
    awareness: {},
    log: [],
    turningPoint: null,
    pendingDelayed: null,
    lastEmployeeNote: null,
    lastAttackerNote: null,
    lastSafe: null,
    justReached: null,
    snapshots: {},
    endingType: null,
    finalScores: null,
    audienceMode: false,
  };
}

function cloneForSnapshot(state){
  return JSON.parse(JSON.stringify({
    screen: state.screen, scenarioIndex: state.scenarioIndex, phase:'deciding',
    riskScore: state.riskScore, flags: state.flags, counts: state.counts,
    awareness: state.awareness, log: state.log, turningPoint: state.turningPoint,
    pendingDelayed:null, lastEmployeeNote:null, lastAttackerNote:null, lastSafe:null, justReached:null,
    endingType:null, finalScores:null, audienceMode: state.audienceMode,
  }));
}

function reducer(state, action){
  switch(action.type){
    case 'START_SIM': {
      const s = { ...initialState(), screen:'sim', audienceMode: state.audienceMode };
      s.snapshots = { 0: cloneForSnapshot(s) };
      return s;
    }
    case 'TOGGLE_AUDIENCE': {
      return { ...state, audienceMode: !state.audienceMode };
    }
    case 'DECIDE': {
      const p = action.payload;
      const scenario = SCENARIOS[state.scenarioIndex];
      const newFlags = { ...state.flags, ...p.flagPatch };
      // derive companyAccessReached from accumulated flags
      newFlags.companyAccessReached = !!(newFlags.accountCompromised && newFlags.sensitiveAccessGranted && (newFlags.fileOpened || newFlags.riskyWifi));
      const newRisk = clamp(state.riskScore + p.riskDelta, 0, 100);
      const newCounts = {
        safeDecisions: state.counts.safeDecisions + (p.safe ? 1 : 0),
        riskyDecisions: state.counts.riskyDecisions + (p.safe ? 0 : 1),
        securityNotified: state.counts.securityNotified + (p.notify ? 1 : 0),
      };
      const newAwareness = p.category ? { ...state.awareness, [p.category]: p.categoryScore } : state.awareness;
      const logEntry = { scenarioIndex: state.scenarioIndex, time: scenario.time, title: scenario.title, choice: p.choiceLabel, safe: p.safe };
      let turningPoint = state.turningPoint;
      if(!turningPoint && !p.safe){
        turningPoint = { scenarioIndex: state.scenarioIndex, time: scenario.time, choiceLabel: p.choiceLabel, explanation: TURNING_EXPLAIN[scenario.id] };
      }
      return {
        ...state,
        phase: 'resolved',
        flags: newFlags,
        riskScore: newRisk,
        counts: newCounts,
        awareness: newAwareness,
        log: [...state.log, logEntry],
        turningPoint,
        pendingDelayed: p.delayed ? { text: p.delayedText } : null,
        lastEmployeeNote: p.note,
        lastAttackerNote: p.attackerNote || null,
        lastSafe: p.safe,
        justReached: p.attackerNote ? true : null,
      };
    }
    case 'CONTINUE': {
      if(state.phase === 'resolved' && state.pendingDelayed){
        return { ...state, phase:'delayed' };
      }
      // advance scenario
      const nextIndex = state.scenarioIndex + 1;
      if(nextIndex >= SCENARIOS.length){
        const endingType = computeEnding(state.flags, state.counts);
        const finalScores = computeFinalScores(state.flags, state.awareness);
        return { ...state, screen:'ending', endingType, finalScores };
      }
      const advanced = {
        ...state, scenarioIndex: nextIndex, phase:'deciding',
        pendingDelayed:null, lastEmployeeNote:null, lastAttackerNote:null, justReached:null,
      };
      advanced.snapshots = { ...state.snapshots, [nextIndex]: cloneForSnapshot(advanced) };
      return advanced;
    }
    case 'GOTO_REWIND': {
      return { ...state, screen:'rewind' };
    }
    case 'TRY_AGAIN': {
      const idx = action.payload.targetScenarioIndex;
      const snap = state.snapshots[idx];
      if(!snap) return { ...state, screen:'sim' };
      return { ...snap, snapshots: state.snapshots, screen:'sim', scenarioIndex: idx, phase:'deciding' };
    }
    case 'RESTART': {
      return { ...initialState() };
    }
    default: return state;
  }
}

/* =========================================================
   SMALL UI PIECES
========================================================= */
function RiskMeter({ riskScore }){
  const level = riskLevel(riskScore);
  const color = RISK_COLOR[level];
  return (
    <div className="risk-meter">
      <span className="risk-label" style={{ background: color+'22', color, border:'1px solid '+color+'55' }}>
        RISK: {level}
      </span>
      <div className="risk-track">
        <div className="risk-fill" style={{ width: riskScore+'%', background: color, boxShadow: level==='CRITICAL' ? '0 0 14px '+color : 'none' }}></div>
      </div>
    </div>
  );
}

function AttackerGraph({ flags, justReached }){
  const reached = reachedNodes(flags);
  const keys = ATTACKER_NODES;
  return (
    <div className="atk-chain">
      {keys.map((k,i)=>{
        const isReached = reached[k];
        const prevReached = i===0 ? true : reached[keys[i-1]];
        return (
          <React.Fragment key={k}>
            {i>0 && <div className={"atk-connector " + (isReached && prevReached ? 'reached':'')}></div>}
            <div className={"atk-node " + (isReached?'reached':'') + (isReached && justReached ? ' justreached':'')}>
              <div className="atk-dot"></div>
              <div className="atk-nodelabel">{k}</div>
              <div className="atk-status">{isReached ? (i===0?'ORIGIN':'REACHED') : 'LOCKED'}</div>
            </div>
          </React.Fragment>
        );
      })}
    </div>
  );
}

function AudienceOverlay({ onSkip }){
  const [remaining, setRemaining] = useState(3);
  useEffect(()=>{
    if(remaining<=0){ onSkip(); return; }
    const t = setTimeout(()=>setRemaining(remaining-1), 1000);
    return ()=>clearTimeout(t);
  },[remaining]);
  return (

========================================================= */
function CountUp({ value, duration=1200 }){
  const [n, setN] = useState(0);
  useEffect(()=>{
    let start = null;
    let raf;
    function step(ts){
      if(!start) start = ts;
      const progress = Math.min(1, (ts-start)/duration);
      setN(Math.round(progress * value));
      if(progress < 1) raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[value]);
  return <span>{n}</span>;
}

/* =========================================================
   REWIND SCREEN
========================================================= */
function RewindScreen({ state, dispatch }){
  const reached = reachedNodes(state.flags);
  const chain = ATTACKER_NODES.filter(n => reached[n]).reverse().concat(['ORIGINAL EMAIL']);
  const [idx, setIdx] = useState(-1);
  const [done, setDone] = useState(false);

  useEffect(()=>{
    if(idx >= chain.length - 1){ setDone(true); return; }
    const t = setTimeout(()=>setIdx(idx+1), 550);
    return ()=>clearTimeout(t);
  },[idx]);

  const tp = state.turningPoint;

  return (
    <div className="center-screen fade-in">
      <div style={{ fontSize:12, letterSpacing:'.12em', color:'#ff9da2', marginBottom:14 }}>REWINDING THE ATTACK TIMELINE...</div>
      <div style={{ marginBottom: done ? 30 : 10 }}>
        {chain.map((step,i)=>(
          <div key={step} className={"rewind-node mono " + (i<=idx ? 'active':'')}>{step}{i<chain.length-1 && ' ↓'}</div>
        ))}
      </div>

      {done && tp && (
        <div className="turning-card glass card fade-up">
          <div style={{ fontSize:13, letterSpacing:'.1em', color:'#ff9da2', marginBottom:8 }}>THIS WAS THE MOMENT.</div>
          <div className="mono" style={{ fontSize:12.5, color:'var(--mist)', marginBottom:6 }}>{tp.time}</div>
          <div style={{ fontSize:16, fontWeight:700, marginBottom:10 }}>You clicked: {tp.choiceLabel}</div>
          <p style={{ fontSize:13.5, color:'#d5dceb', lineHeight:1.6, marginBottom:18 }}>{tp.explanation}</p>
          <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
            <button className="btn btn-primary" onClick={()=>dispatch({ type:'TRY_AGAIN', payload:{ targetScenarioIndex: tp.scenarioIndex } })}>
              Try Again From Here
            </button>
            <button className="btn btn-ghost" onClick={()=>dispatch({ type:'RESTART' })}>Restart Simulation</button>
          </div>
        </div>
      )}
    </div>
  );
}

      {state.screen === 'sim' && <SimScreen state={state} dispatch={dispatch} />}
      {state.screen === 'ending' && <EndingScreen state={state} dispatch={dispatch} />}
      {state.screen === 'rewind' && <RewindScreen state={state} dispatch={dispatch} />}
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
